name: Release

# Triggered by pushing a version tag, e.g.:
#   npm version patch && git push --follow-tags
# Builds the ESM package + standalone bundle, publishes to npm (public),
# and attaches the standalone .js to the GitHub release.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/attach the GitHub release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Guard: the package must ship ONLY the built bundles (+ .d.ts types) — never
      # source files or sourcemaps. Fails the release before publishing if it would.
      - name: Verify package contents (no source, no .map)
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const meta = JSON.parse(execSync("npm pack --dry-run --json"));
            const files = meta[0].files.map((f) => f.path);
            console.log("Tarball files:\n" + files.map((f) => "  " + f).join("\n"));
            const bad = files.filter((f) =>
              f.endsWith(".map") ||           // sourcemaps
              /(^|\/)src\//.test(f) ||        // source tree
              (f.endsWith(".ts") && !f.endsWith(".d.ts")) // raw TS source
            );
            if (bad.length) {
              console.error("::error::package would ship disallowed files:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("OK — only built bundles + type declarations.");
          '

      # Write the npm auth token, then fail EARLY with a clear message if it is
      # invalid or lacks access (instead of a cryptic 404/401 during publish).
      - name: Configure npm auth + verify token
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm whoami --registry=https://registry.npmjs.org

      # publishConfig.access=public in package.json also makes it public; the flag
      # is explicit belt-and-suspenders.
      - name: Publish to npm
        run: npm publish --access public

      - name: Attach standalone bundle to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/maplibre-3d-layers.standalone.mjs

      # Consumers that pin this package (styleeditor, community docs) open a bump PR on this
      # event; each one ignores packages it doesn't use and waits until npm serves the version.
      # The version is the one npm publish just used: package.json's, not the tag's.
      - name: Notify consumers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAPTOOLKIT_OPS_PAT }}
        run: |
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          for repo in maptoolkit/styleeditor maptoolkit/docs; do
            gh api "repos/$repo/dispatches" -f event_type=maptoolkit-package-released \
              -f "client_payload[package]=$name" -f "client_payload[version]=$version" \
              && echo "$repo ← $name@$version" \
              || echo "::warning::could not notify $repo about $name@$version"
          done
